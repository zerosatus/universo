<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0F172A" />
  <title>⚛️ Fórmulas de Física</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      svg: { fontCache: 'global' },
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">⚛️</span>
      <div>
        <h1>Fórmulas de Física</h1>
        <p class="subtitle">Todas as fórmulas essenciais • Pesquisa instantânea</p>
      </div>
    </div>
    <span class="chip" id="totalChip">0 fórmulas</span>
  </header>

  <section class="search-section">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input
        type="search"
        id="searchInput"
        placeholder="Pesquisar por nome, símbolo, variável..."
        autocomplete="off"
      />
      <button class="clear-btn" id="clearBtn" aria-label="Limpar">✕</button>
    </div>
  </section>

  <nav class="categories" id="categoriesNav"></nav>

  <main class="grid" id="grid"></main>

  <div class="empty-state" id="emptyState" style="display:none">
    <div class="empty-icon">🔎</div>
    <h2>Nenhuma fórmula encontrada</h2>
    <p>Tente outro termo de pesquisa ou categoria.</p>
  </div>

  <footer>
    <p>⚛️ Fórmulas de Física • Zero IA</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
